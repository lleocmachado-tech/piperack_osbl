[build]
  base = "frontend"
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# /api is routed by scripts/netlify-redirects.mjs using API_ORIGIN.
# Configure API_ORIGIN in the Netlify build environment before deploying.
